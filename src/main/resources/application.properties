server.port=8081

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.application.name=ms-orcamentos

# DataSource (banco proprio do servico)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_ms_orcamentos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ms_orcamentos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ms_orcamentos}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - dono do schema de orcamentos, pagamentos e reembolsos
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-orcamentos-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.budget.kafka.topic.request=${APP_BUDGET_KAFKA_TOPIC_REQUEST:budget-approval-request}
app.budget.kafka.topic.decision=${APP_BUDGET_KAFKA_TOPIC_DECISION:budget-decision}
app.events.topic.service-order=${APP_EVENTS_TOPIC_SERVICE_ORDER:service-order-events}
app.events.topic.budget=${APP_EVENTS_TOPIC_BUDGET:budget-events}
app.events.topic.payment=${APP_EVENTS_TOPIC_PAYMENT:payment-events}

# Mercado Pago (WireMock locally)
app.mercadopago.base-url=${APP_MERCADOPAGO_BASE_URL:http://localhost:8089}
app.mercadopago.access-token=${APP_MERCADOPAGO_ACCESS_TOKEN:local-token}
app.payment.preference-ttl=${APP_PAYMENT_PREFERENCE_TTL:PT1H}
app.payment.timeout-check-ms=${APP_PAYMENT_TIMEOUT_CHECK_MS:60000}

# E-mail (Mailpit)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.budget.mail.from=${APP_BUDGET_MAIL_FROM:orcamentos@oficina-mecanica.com.br}

# Base URL usada para montar o link magico enviado por e-mail
app.budget.base-url=${APP_BUDGET_BASE_URL:http://localhost:8081}

# Outros servicos (HTTP, nunca acesso direto ao banco)
app.service-order.base-url=${APP_SERVICE_ORDER_BASE_URL:http://localhost:8082}
app.registration.base-url=${APP_REGISTRATION_BASE_URL:http://localhost:8080}

# Cache de precos do catalogo (ISO-8601 duration)
app.cache.catalog-service.ttl=${APP_CACHE_CATALOG_SERVICE_TTL:PT1H}
app.cache.catalog-service.max-size=${APP_CACHE_CATALOG_SERVICE_MAX_SIZE:1000}
